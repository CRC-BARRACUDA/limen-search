# Українська. Перший блок читає хост, а не модуль: [module] title та
# description — це те, що показує картка модуля та вкладка. Для англійської
# такого блоку немає: хост бере її з limen.toml.

[module]
title = "Локальний пошук"
description = "Знаходить файли, теки та архіви на ЦЬОМУ комп'ютері за назвою, фразою, регулярним виразом або датою — одразу в кількох місцях, читаючи їх паралельно."

